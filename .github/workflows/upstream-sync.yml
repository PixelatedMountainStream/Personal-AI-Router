# upstream-sync: one daily PR merging NVIDIA develop into our develop, updated in place.
# A PR whose range carries a new upstream tag is labelled `upstream-release`.
# Spec: PLAN-pair-upstream-sync.md section 4. Ported from the codex fork's upstream-sync.yml.
#
# Secret UPSTREAM_SYNC_TOKEN (required): fine-grained PAT or App token scoped to this repo with
# contents, workflows, pull-requests and issues. Never GITHUB_TOKEN: PRs it opens do not trigger
# local-ci, and it cannot push workflow files.
name: upstream-sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref or tag to sync (default: upstream/develop)"
        required: false
        type: string
      force:
        description: "Run the merge path even if upstream has not moved"
        required: false
        type: boolean
        default: false

# Least privilege by default; the two privileged jobs raise it. Candidate (merged) code is only ever
# executed in the `check` job, which has read-only permissions and no PAT. The privileged jobs run
# sync_upstream.py copied from `develop` before the candidate is checked out, never the candidate's copy.
permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  BASE: develop

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write, pull-requests: write, issues: write }
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      # Pin gh to this fork: the `upstream` remote added below would otherwise
      # make gh target NVIDIA for pr/issue commands (codex fork PR #24).
      GH_REPO: ${{ github.repository }}
    outputs:
      status_code: ${{ steps.status.outputs.code }}
      mode: ${{ steps.status.outputs.mode }}
      code: ${{ steps.merge.outputs.code }}
      candidate: ${{ steps.bundle.outputs.candidate }}
      pr_labels: ${{ steps.pr.outputs.labels }}
      # Identity of what publish may push comes from this privileged job's outputs, never from artifacts.
      branch: ${{ steps.bundle.outputs.branch }}
      cand_sha: ${{ steps.bundle.outputs.cand_sha }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Require UPSTREAM_SYNC_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=UPSTREAM_SYNC_TOKEN missing::Create the secret (fine-grained PAT, this repo only: contents, workflows, pull-requests, issues)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # No persisted GITHUB_TOKEN header: pushes use UPSTREAM_SYNC_TOKEN in the publish job.
          persist-credentials: false

      - name: Trust develop's scripts, configure git
        run: |
          # Copied before any candidate branch is checked out: this is the only code that runs with the PAT.
          cp -R local/scripts "$RUNNER_TEMP/trusted"
          mkdir -p "$RUNNER_TEMP/out"
          git config user.name "pair upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/NVIDIA/Personal-AI-Router.git
          git fetch upstream --tags --quiet
          git fetch origin --quiet
          for l in "upstream-sync 0e8a16 Upstream sync" "upstream-release 1d76db Sync carries a new upstream tag" "sync-failing d93f0b Sync needs repair"; do
            set -- $l; gh label create "$1" --color "$2" --description "${*:3}" 2>/dev/null || true
          done

      - name: Find the open sync PR
        id: pr
        run: |
          # Only a same-repo PR from an upstream-sync/* branch is ever treated as the sync PR.
          json=$(gh pr list --label upstream-sync --state open --base "$BASE" \
            --json number,headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("upstream-sync/")))] | .[0] // empty')
          [ -z "$json" ] && exit 0
          n=$(jq -r .number <<<"$json"); b=$(jq -r .headRefName <<<"$json")
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "branch=$b" >> "$GITHUB_OUTPUT"
          echo "labels=$(gh pr view "$n" --json labels --jq '[.labels[].name] | join(",")')" >> "$GITHUB_OUTPUT"
          # Merge into the open PR's branch so human commits are preserved.
          git checkout -q -B "$b" "origin/$b"

      - name: Status
        id: status
        env:
          REF_INPUT: ${{ inputs.ref }}
          FORCE_INPUT: ${{ inputs.force }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Measured from the pending PR branch when there is one, so later tags update it in place.
          args=(--root "$GITHUB_WORKSPACE" status --base HEAD --tags-base "origin/$BASE")
          [ -n "$REF_INPUT" ] && args+=(--ref "$REF_INPUT")
          [ "$FORCE_INPUT" = "true" ] && args+=(--force)
          [ -n "$PR_NUMBER" ] && args+=(--pending)   # nothing new + open PR => mode recheck (re-run checks)
          set +e
          python3 "$RUNNER_TEMP/trusted/sync_upstream.py" "${args[@]}" > "$RUNNER_TEMP/out/status.json"
          code=$?
          cat "$RUNNER_TEMP/out/status.json"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode // "none"' "$RUNNER_TEMP/out/status.json")" >> "$GITHUB_OUTPUT"
          exit 0   # a failed status is reported by the publish job, never silently dropped

      - name: Merge
        id: merge
        if: steps.status.outputs.mode == 'sync' || steps.status.outputs.mode == 'bump'
        env:
          REF_INPUT: ${{ inputs.ref }}
          FORCE_INPUT: ${{ inputs.force }}
          MODE: ${{ steps.status.outputs.mode }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          args=(--root "$GITHUB_WORKSPACE" merge)
          [ -n "$REF_INPUT" ] && args+=(--ref "$REF_INPUT")
          [ "$FORCE_INPUT" = "true" ] && args+=(--force)
          [ "$MODE" = "bump" ] && args+=(--bump-only)
          [ -n "$PR_BRANCH" ] && args+=(--reuse --branch "$PR_BRANCH")
          set +e
          python3 "$RUNNER_TEMP/trusted/sync_upstream.py" "${args[@]}" > "$RUNNER_TEMP/out/merge.json"
          code=$?
          cat "$RUNNER_TEMP/out/merge.json"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Re-apply workflow neutralization before any push
        if: steps.merge.outputs.code == '0'
        run: python3 "$RUNNER_TEMP/trusted/sync_upstream.py" --root "$GITHUB_WORKSPACE" neutralize --commit

      - name: Bundle the candidate
        id: bundle
        env:
          MODE: ${{ steps.status.outputs.mode }}
          MERGE_CODE: ${{ steps.merge.outputs.code }}
        run: |
          committed=$(jq -r '.committed // false' "$RUNNER_TEMP/out/merge.json" 2>/dev/null || echo false)
          if { [ "$committed" = "true" ] || [ "$MERGE_CODE" = "0" ] || [ "$MODE" = "recheck" ]; } \
             && [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BASE")" ] \
             && [ "$MODE" != "none" ]; then
            git merge --abort 2>/dev/null || true
            # A PAT push triggers workflows, so a candidate that touches .github/workflows/** is never bundled
            # unless every change is a verified workflow_dispatch-only neutralization (publish re-checks).
            set +e
            python3 "$RUNNER_TEMP/trusted/sync_upstream.py" --root "$GITHUB_WORKSPACE" workflow-guard \
              --base "origin/$BASE" --cand HEAD > "$RUNNER_TEMP/out/guard.json"
            guard=$?
            set -e
            cat "$RUNNER_TEMP/out/guard.json"
            [ "$guard" = "0" ] || exit 0   # workflow_review: no bundle, no push; report opens the issue
            git bundle create "$RUNNER_TEMP/out/cand.bundle" HEAD --not "origin/$BASE"
            echo "candidate=true" >> "$GITHUB_OUTPUT"
            echo "cand_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "bundle_sha256=$(sha256sum "$RUNNER_TEMP/out/cand.bundle" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sync-merge
          path: ${{ runner.temp }}/out

  check:
    needs: merge
    if: needs.merge.outputs.candidate == 'true' && (needs.merge.outputs.code == '0' || needs.merge.outputs.mode == 'recheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Runs candidate code: read-only token, no PAT, no persisted credentials, no caches.
    permissions:
      contents: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: sync-merge
          path: ${{ runner.temp }}/in

      - name: Check out the candidate
        run: |
          git fetch "$RUNNER_TEMP/in/cand.bundle" HEAD:refs/heads/candidate
          git checkout -q candidate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Actions has no job-level `cache-mode: none` (no such key exists). Equivalent: setup-go `cache: false`,
      # setup-python caches nothing by default, and this job uses no actions/cache, so nothing is restored
      # from or saved to the repo cache that the privileged jobs could later read.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/nvpair-proxy/go.mod
          cache: false

      - name: Check
        id: check
        env:
          PR_LABELS: ${{ needs.merge.outputs.pr_labels }}
        run: |
          # Labels on the open sync PR (e.g. surface-budget-raise) reach the budget_raised rule.
          args=(); IFS=, read -ra labels <<<"$PR_LABELS"; for l in "${labels[@]}"; do [ -n "$l" ] && args+=(--label "$l"); done
          mkdir -p "$RUNNER_TEMP/check"
          set +e
          python3 local/scripts/sync_upstream.py check --base "origin/$BASE" "${args[@]}" > "$RUNNER_TEMP/check/check.json"
          code=$?
          cat "$RUNNER_TEMP/check/check.json"
          echo "code=$code" >> "$GITHUB_OUTPUT"   # passed through to report: exit 2/3 must escalate
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-check-result   # only check.json: it is untrusted data in publish
          path: ${{ runner.temp }}/check/check.json

  publish:
    needs: [merge, check]
    if: >-
      always() && needs.merge.result == 'success' &&
      (needs.merge.outputs.mode == 'sync' || needs.merge.outputs.mode == 'bump' || needs.merge.outputs.mode == 'recheck' || needs.merge.outputs.status_code != '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write, pull-requests: write, issues: write }
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Trust develop's scripts
        run: cp -R local/scripts "$RUNNER_TEMP/trusted"

      - uses: actions/download-artifact@v4
        with:
          name: sync-merge
          path: ${{ runner.temp }}/in

      - uses: actions/download-artifact@v4
        continue-on-error: true   # absent when the merge failed or the check job did not run: report then escalates
        with:
          name: sync-check-result
          path: ${{ runner.temp }}/chk   # separate directory: nothing from the check job can overwrite sync-merge files

      - name: Report
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_CODE: ${{ needs.check.outputs.code }}
        run: |
          in="$RUNNER_TEMP/in"
          python3 "$RUNNER_TEMP/trusted/sync_upstream.py" --root "$GITHUB_WORKSPACE" report --status "$in/status.json" \
            --merge "$in/merge.json" --guard "$in/guard.json" --check "$RUNNER_TEMP/chk/check.json" --check-code "$CHECK_CODE" --run-url "$RUN_URL" --out "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.json"
          for k in outcome title draft issue issue_title; do
            echo "$k=$(jq -r ".$k" "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"
          done
          echo "labels=$(jq -r '.labels | join(",")' "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"

      - name: Publish (PR and issue)
        env:
          OUTCOME: ${{ steps.report.outputs.outcome }}
          TITLE: ${{ steps.report.outputs.title }}
          DRAFT: ${{ steps.report.outputs.draft }}
          WANT_ISSUE: ${{ steps.report.outputs.issue }}
          ISSUE_TITLE: ${{ steps.report.outputs.issue_title }}
          LABELS: ${{ steps.report.outputs.labels }}
          BRANCH: ${{ needs.merge.outputs.branch }}
          CAND_SHA: ${{ needs.merge.outputs.cand_sha }}
          BUNDLE_SHA256: ${{ needs.merge.outputs.bundle_sha256 }}
        run: |
          in="$RUNNER_TEMP/in"; body="$RUNNER_TEMP/report.md"
          PR_NUMBER=$(gh pr list --label upstream-sync --state open --base "$BASE" --json number,headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("upstream-sync/")))] | .[0].number // empty')
          if [ "$OUTCOME" != "workflow_review" ] && [ -f "$in/cand.bundle" ] && [ -n "$BRANCH" ]; then
            # Everything downloaded is data. Verify it against the privileged job's outputs before using it.
            echo "$BUNDLE_SHA256  $in/cand.bundle" | sha256sum -c - || { echo "::error::bundle hash mismatch"; exit 1; }
            git fetch "$in/cand.bundle" HEAD:refs/heads/candidate
            [ "$(git rev-parse refs/heads/candidate)" = "$CAND_SHA" ] || { echo "::error::candidate sha mismatch"; exit 1; }
            # Re-derive touched workflow paths from the verified bundle with trusted code (NUL-delimited): a PAT push
            # triggers workflows, so only verified workflow_dispatch-only neutralizations may change.
            python3 "$RUNNER_TEMP/trusted/sync_upstream.py" --root "$GITHUB_WORKSPACE" workflow-guard \
              --base "origin/$BASE" --cand "$CAND_SHA" || { echo "::error::candidate changes .github/workflows beyond neutralization; refusing to push"; exit 1; }
            # Never push anywhere but a sync branch (a conflicted merge is committed with markers; the draft PR blocks it).
            dest="refs/heads/$BRANCH"
            case "$dest" in refs/heads/upstream-sync/*) ;; *) echo "::error::refusing to push to $dest"; exit 1;; esac
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/candidate:$dest"
          fi
          title=(); [ -n "$TITLE" ] && title=(--title "$TITLE")
          if [ -n "$PR_NUMBER" ] && [ "$OUTCOME" != "workflow_review" ]; then
            gh pr edit "$PR_NUMBER" "${title[@]}" --body-file "$body" --add-label "$LABELS"
            if [ "$OUTCOME" = "clean" ]; then
              gh pr edit "$PR_NUMBER" --remove-label sync-failing || true
              gh pr ready "$PR_NUMBER" || true
            elif [ "$DRAFT" = "true" ]; then
              gh pr ready "$PR_NUMBER" --undo || true
            fi
          elif [ "$OUTCOME" != "workflow_review" ] && [ -f "$in/cand.bundle" ] && [ -n "$BRANCH" ]; then
            extra=(); [ "$DRAFT" = "true" ] && extra+=(--draft)
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$body" --label "$LABELS" "${extra[@]}"
          fi
          if [ "$WANT_ISSUE" = "true" ]; then
            n=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
            if [ -n "$n" ]; then
              gh issue edit "$n" --title "$ISSUE_TITLE" --add-label "$LABELS"
              gh issue comment "$n" --body-file "$body"
            else
              gh issue create --label "$LABELS" --title "$ISSUE_TITLE" --body-file "$body"
            fi
          fi
          # A failing or escalated sync still fails the run so it is visible.
          [ "$OUTCOME" = "clean" ]
