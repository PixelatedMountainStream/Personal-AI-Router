[budget]            # ratchet, lowered per migration PR; raising it needs label surface-budget-raise (budget_raised)
max_lines = 1889    # changed lines in modified upstream files only (measured on pms/develop)
max_files = 43      # modified upstream files only
max_legacy_added_lines = 3377   # separate shrinking budget for legacy_added

# Optional per-file budgets for hot files are added by PR-F:
# [[file]]
# path = "services/nvpair-proxy/proxy.go"
# max_lines = 30
# max_hunks = 9
# max_seams = 7

[go]
fork_import_prefixes = ["nvpair-proxy/local/", "nvpair-engine-manager/local/", "nvpair-shared/local/"]
fork_allowed_imports = ["nvpair-shared/", "golang.org/x/"]   # plus stdlib and other local packages
