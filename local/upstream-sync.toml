# Config for local/scripts/sync_upstream.py. Spec: PLAN-pair-upstream-sync.md section 4.
upstream_remote = "upstream"
upstream_ref = "develop"
base_branch = "develop"
# A tag matching this (and newer than last_release_tag) flags the sync as a release.
tag_pattern = '^v\d+\.\d+\.\d+$'

# Modules built/vetted/tested by `sync_upstream.py check`.
go_modules = [
  "services/nvpair-proxy", "services/nvpair-engine-manager", "services/shared",
  "services/nvpair-node-scanner", "services/nvpair-ui-broker", "services/nvpair-job-scheduler",
  "services/nvpair-node-settings", "services/tests",
]

# The 10 Local CI check names (job `name:`s in .github/workflows/local-ci.yml; the Go matrix is expanded).
# Branch protection on develop must require exactly this set before a sync PR is enrolled in auto-merge;
# test_required_checks_match_local_ci keeps it in step with the workflow.
required_checks = [
  "Fork surface", "Python tests",
  "Go test (nvpair-proxy)", "Go test (nvpair-engine-manager)", "Go test (shared)",
  "Go test (nvpair-node-scanner)", "Go test (nvpair-ui-broker)", "Go test (nvpair-job-scheduler)",
  "Go test (nvpair-node-settings)", "Go cross-process tests",
]

# Modules NOT vetted (build and test still run). services/tests is NVIDIA's own module with upstream
# vet findings (main_test.go:213, :231).
go_vet_skip = ["services/tests"]

# Single source for the sync check AND local-ci.yml (read via local/scripts/go_rules.py). Known failures
# skipped by `go test -skip`. Drop an entry once it passes on ubuntu.
# NOTE: local-ci's cross-process job still carries its own inline GPU_pressure_converges skip (services/tests);
# it is intentionally not in this file, another branch is fixing that regression.
[go_skip]
"services/nvpair-engine-manager" = "TestUninstallTerminatesRunningInstance"  # #11, macOS-only procImage
"services/tests" = "TestWorkloadManagerOutboundBroadcast"                      # #12, hard-coded port 14320
